services:
  # ========================================================
  # Python FastAPI 後端服務 (RAG 臨床醫學 + 連鎖藥局爬蟲 + TFDA 審核 + SQLite)
  # ========================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: caregift-backend
    ports:
      - "8000:8000"
    volumes:
      # 掛載 SQLite 資料庫，確保容器重啟時歷史紀錄、親友清單與點數不會遺失
      - ./backend/caregift.db:/app/caregift.db
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      - PYTHONUNBUFFERED=1

  # ========================================================
  # 前端 Nginx 網頁伺服器 (提供 SPA 靜態檔案並反向代理 /api)
  # ========================================================
  frontend:
    image: nginx:alpine
    container_name: caregift-frontend
    ports:
      - "8080:80"
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./style.css:/usr/share/nginx/html/style.css:ro
      - ./bear.png:/usr/share/nginx/html/bear.png:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    restart: unless-stopped
