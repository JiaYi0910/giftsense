<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="GiftSense 智慧關懷送禮">

  <!-- iOS：Safari「分享 → 加入主畫面」後以全螢幕 App 方式開啟 -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="GiftSense">
  <meta name="theme-color" content="#2563EB">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>GiftSense</title>
  <link rel="manifest" href="manifest.json">
</head>
<body style="margin:0;background:#F4F8FF;">
  <!-- 載入畫面：Flutter 第一個畫面出現前顯示 GiftSense logo，iPhone 上不會一片空白 -->
  <div id="gs-splash" style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:linear-gradient(180deg,#F4F8FF,#E3EDFF);font-family:-apple-system,'PingFang TC','Noto Sans TC',sans-serif;z-index:9999;transition:opacity .35s;">
    <img src="icons/Icon-192.png" alt="GiftSense" width="96" height="96" style="border-radius:24px;box-shadow:0 10px 30px rgba(37,99,235,.18);">
    <div style="font-size:20px;font-weight:800;color:#0F172A;letter-spacing:.3px;">GiftSense</div>
    <div style="font-size:13px;color:#64748B;">心意，醫觸即達 · 載入中…</div>
  </div>
  <!-- iPhone／iPad 用 Safari 開啟、還沒加入主畫面時，提示「分享 → 加入主畫面」（免費的 App 使用方式） -->
  <div id="gs-a2hs" style="display:none;position:fixed;left:12px;right:12px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:9998;background:#FFFFFF;border:1px solid #BFDBFE;border-radius:18px;box-shadow:0 12px 32px rgba(30,58,138,.18);padding:14px 14px 12px;font-family:-apple-system,'PingFang TC','Noto Sans TC',sans-serif;">
    <div style="display:flex;gap:12px;align-items:center;">
      <img src="icons/apple-touch-icon.png" alt="" width="44" height="44" style="border-radius:11px;flex:none;">
      <div style="flex:1;min-width:0;">
        <div style="font-size:14px;font-weight:800;color:#0F172A;">把 GiftSense 加入主畫面</div>
        <div style="font-size:12px;color:#475569;line-height:1.5;margin-top:2px;">點下方 Safari 的「分享」<span style="display:inline-block;border:1.5px solid #2563EB;border-radius:4px;width:11px;height:11px;vertical-align:-1px;margin:0 2px;"></span>→「加入主畫面」，就能像 App 一樣全螢幕使用。</div>
      </div>
    </div>
    <div style="text-align:right;margin-top:8px;">
      <button id="gs-a2hs-ok" style="border:none;background:#2563EB;color:#FFFFFF;font-weight:700;font-size:13px;border-radius:12px;padding:8px 16px;">知道了</button>
    </div>
  </div>
  <script>
    (function () {
      var ua = navigator.userAgent || "";
      var isIOS = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
      var isSafari = /Safari/.test(ua) && !/CriOS|FxiOS|EdgiOS|Line\//.test(ua);
      var standalone = window.navigator.standalone === true || window.matchMedia("(display-mode: standalone)").matches;
      var dismissed = false;
      try { dismissed = localStorage.getItem("gs_a2hs_dismissed") === "1"; } catch (e) {}
      if (!isIOS || !isSafari || standalone || dismissed) return;
      var box = document.getElementById("gs-a2hs");
      window.addEventListener("flutter-first-frame", function () {
        setTimeout(function () { box.style.display = "block"; }, 1200);
      });
      document.getElementById("gs-a2hs-ok").addEventListener("click", function () {
        box.style.display = "none";
        try { localStorage.setItem("gs_a2hs_dismissed", "1"); } catch (e) {}
      });
    })();
  </script>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('gs-splash');
      if (!el) return;
      el.style.opacity = '0';
      setTimeout(function () { el.remove(); }, 400);
    });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
